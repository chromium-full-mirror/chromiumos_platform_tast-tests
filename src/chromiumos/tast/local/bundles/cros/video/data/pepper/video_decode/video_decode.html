<html>
<head>
  <title>Pepper video decoder</title>
</head>
<body>
  <!--
  Listening to progress events:
  https://developer.chrome.com/docs/native-client/devguide/coding/progress-events/
  -->
  <div id="listener">
    <script type="text/javascript">
      // Status variables that will be accessible from the Go counterpart of the
      // test.
      var doneLoadingExample = false;
      var doneTesting = false;

      var listener = document.getElementById('listener');
      listener.addEventListener(
          'load',
          function () {
            doneLoadingExample = true;
          },
          /*useCapture=*/true);

      // Handling messages from the app:
      // https://developer.chrome.com/docs/native-client/devguide/coding/message-system/
      listener.addEventListener(
          'message',
          function (message) {
            if (message.data == "testCompleted") {
              doneTesting = true;
            }
          },
          /*useCapture=*/true);
    </script>

    <!--
    Loading an app:
    https://developer.chrome.com/docs/native-client/devguide/coding/application-structure/
    -->
    <embed id="video_decode"
        width="640" height="480"
        src="pnacl/Release/video_decode.nmf"
        type="application/x-pnacl" />
  </div>
</body>
</html>
