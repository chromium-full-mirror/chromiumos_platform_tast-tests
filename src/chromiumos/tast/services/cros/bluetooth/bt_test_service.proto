syntax = "proto3";

package tast.cros.bluetooth;

import "google/protobuf/empty.proto";

option go_package = "chromiumos/tast/services/cros/bluetooth";

// BTTestService allows bluetooth remote tests make calls to local,
// bluetooth-specific functions necessary for testing bluetooth features.
service BTTestService {
  // EnableBluetoothAdapter powers on the bluetooth adapter.
  rpc EnableBluetoothAdapter(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // DisableBluetoothAdapter powers off the bluetooth adapter.
  rpc DisableBluetoothAdapter(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // DisconnectAllDevices disconnects all connected bluetooth devices.
  rpc DisconnectAllDevices(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // RemoveAllDevices removes all bluetooth devices.
  rpc RemoveAllDevices(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // DiscoverDevice confirms that the DUT can discover the provided bluetooth
  // device. Fails if the device is not found or if the discovered matching
  // device's attributes do not match those provided.
  rpc DiscoverDevice(DiscoverDeviceRequest) returns (google.protobuf.Empty) {}

  // PairAndConnectDevice pairs and connects to the specified Device.
  rpc PairAndConnectDevice(PairAndConnectDeviceRequest) returns (google.protobuf.Empty) {}

  // DeviceStatus checks for a given device and returns whether it has been
  // discovered by and paired to the DUT.
  rpc DeviceStatus(DeviceStatusRequest) returns (DeviceStatusResponse) {}

  // PairWithFastPairNotification will attempt to pair a fast pair device with
  // the fast pair notification.
  rpc PairWithFastPairNotification(PairWithFastPairNotificationRequest) returns (google.protobuf.Empty) {}

  // CloseNotifications closes all open notifications.
  rpc CloseNotifications(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // ConfirmSavedDevicesState will attempt to confirm the state of Saved Devices on the Saved
  // Devices subpage. The array of devices should be in the expected order. Fails if the list
  // of Saved Devices doesn't match the one provided.
  rpc ConfirmSavedDevicesState(ConfirmSavedDevicesStateRequest) returns (google.protobuf.Empty) {}

  // RemoveAllSavedDevices will attempt to remove all of the devices from the Saved Devices subpage.
  rpc RemoveAllSavedDevices(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // PairDeviceWithQuickSettings pairs with the specified device through UI
  // interactions with the Quick Settings.
  rpc PairDeviceWithQuickSettings(PairDeviceWithQuickSettingsRequest) returns (google.protobuf.Empty) {}
}

message Device {
  string macAddress = 1;
  string advertisedName = 2;
  bool hasPinCode = 3;
  string pinCode = 4;
}

message DiscoverDeviceRequest {
  // The device to discover.
  Device device = 1;
}

message PairAndConnectDeviceRequest {
  // The device to pair and connect to.
  Device device = 1;

  // When true and the device is found to already be paired, the device is
  // first removed and a new pairing is performed.
  bool forceNewPair = 2;

  // When true and the device is found to already be connected, the device is
  // first disconnected and then a new connection is established.
  bool forceNewConnect = 3;
}

message DeviceStatusRequest {
  // The device to check for status.
  Device device = 1;
}

message DeviceStatusResponse {
  bool is_discovered = 1;
  bool is_paired = 2;
}

enum FastPairProtocol {
  FAST_PAIR_PROTOCOL_INITIAL = 0;
  FAST_PAIR_PROTOCOL_SUBSEQUENT = 1;
  FAST_PAIR_PROTOCOL_RETROACTIVE = 2;
}

message PairWithFastPairNotificationRequest {
  FastPairProtocol protocol = 1;
}

message ConfirmSavedDevicesStateRequest {
  repeated string device_names = 1;
}

message PairDeviceWithQuickSettingsRequest {
  string advertisedName = 1;
}
