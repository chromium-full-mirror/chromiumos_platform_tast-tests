syntax = "proto3";

package tast.cros.hwsec;

import "google/protobuf/empty.proto";

option go_package = "chromiumos/tast/services/cros/hwsec";

service WebauthnService {
  // New logs into a Chrome session as a fake user. Close must be called later
  // to clean up the associated resources.
  rpc New (NewRequest) returns (google.protobuf.Empty) {}

  // Close releases the resources obtained by New.
  rpc Close (google.protobuf.Empty) returns (google.protobuf.Empty) {}

  rpc StartWebauthn (StartWebauthnRequest) returns (google.protobuf.Empty) {}

  rpc StartMakeCredential (google.protobuf.Empty) returns (WebAuthnCredential) {}

  rpc DoMakeCredential (google.protobuf.Empty) returns (google.protobuf.Empty) {}

  rpc StartGetAssertion (StartGetAssertionRequest) returns (google.protobuf.Empty) {}

  rpc DoGetAssertion (google.protobuf.Empty) returns (google.protobuf.Empty) {}

  rpc EnterPassword (EnterPasswordRequest) returns (google.protobuf.Empty) {}
}

enum BrowserType {
  ASH = 0;
  LACROS = 1;
}

enum UserVerification {
  DISCOURAGED = 0;
  PREFERRED = 1;
  REQUIRED = 2;
}

enum AuthenticatorType {
  UNSPECIFIED = 0;
  PLATFORM = 1;
  CROSS_PLATFORM = 2;
}

enum AttestationType {
  NOT_SPECIFIED = 0;
  NONE = 1;
  INDIRECT = 2;
  DIRECT = 3;
  ENTERPRISE= 4;
}

message NewRequest {
  reserved 1 to 3;
  BrowserType browser_type = 4;
  // KeepState controls whether to keep existing user profiles.
  bool keep_state = 5;
  // DataPath is the path that contains data files that the test needs.
  // The test should copy those files into a tempdir on the DUT for the
  // service to access.
  string data_path = 6;
  // AllowEnterpriseAttestation controls whether the local test site
  // is allowed to send enterprise attestation requests.
  bool allow_enterprise_attestation = 7;
}

message EnterPasswordRequest {
  string password = 1;
}

message StartWebauthnRequest {
  UserVerification user_verification = 1;
  AuthenticatorType authenticator_type = 2;
  AttestationType attestation_type = 3;
  bool has_dialog = 4;
}

message PublicKey {
  string data_b64 = 1;
  string key_type = 2;
}

message WebAuthnCredential {
  string credential_id_b64 = 1;
  PublicKey public_key = 2;
  string serial_number_b64 = 3;
}

message StartGetAssertionRequest {
  WebAuthnCredential cred = 1;
}
