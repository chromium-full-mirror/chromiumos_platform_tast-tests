syntax = "proto3";

package tast.cros.nebraska;

import "google/protobuf/empty.proto";

option go_package = "chromiumos/tast/services/cros/nebraska";

// Service provides functions to interact with a Nebraska instance on the test device.
service Service {
  rpc Start (StartRequest) returns (StartResponse) {}
  rpc Stop (google.protobuf.Empty) returns (google.protobuf.Empty) {}

  rpc UpdatePayload (UpdatePayloadRequest) returns (google.protobuf.Empty) {}

  rpc ReadLog (google.protobuf.Empty) returns (ReadLogResponse) {}
}

message StartRequest {
  optional int32 port = 1;
}

message UpdatePayloadRequest {
  Payload update = 1;
}

message Payload {
  string address = 1;
  string metadata_folder = 2;
}

message StartResponse {
  int32 port = 1;
  string runtime_root = 3;

  reserved 2;
}

message ReadLogResponse {
  bytes data = 1;
}
