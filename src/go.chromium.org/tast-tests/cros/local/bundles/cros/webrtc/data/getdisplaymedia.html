<!DOCTYPE html>
<html>
<head><title>GetDisplayMedia test</title></head>
<body>
  <canvas id="canvas" width="10" height="10"></canvas>
  <video id="video" controls autoplay muted></video>
<script src="canvas_animation.js"></script>
<script src="third_party/blackframe.js"></script>
<script>

async function start(surface) {
  await drawCanvasAlternatingColours(320, 240, 30);
  return new Promise((resolve, reject) => {
    const video = document.querySelector('video');
    video.style.display = 'none';

    const displayMediaOptions = {
      video: {
        displaySurface: surface
      },
      audio: false,
      selfBrowserSurface: "include",
    };

    navigator.mediaDevices.getDisplayMedia(displayMediaOptions)
      .then(mediaStream => {
        if (mediaStream.getVideoTracks().length !== 1) {
          throw new DOMException('Wrong getVideoTracks() length',
            'InvalidStateError');
        }

        video.srcObject = mediaStream;
        const mediaStreamSettings = mediaStream.getVideoTracks()[0]
          .getSettings();
        const actualSurfaceType =
              mediaStream.getVideoTracks()[0].getSettings().displaySurface;
        if (actualSurfaceType !== surface) {
          throw new DOMException(`Wrong capture type, got: ` +
                                 `${actualSurfaceType}, expected: ${surface}`,
                                 'TypeError');
        }

        video.onplay = () => {
          video.width = mediaStreamSettings.width;
          video.height = mediaStreamSettings.height;

          if (isNaN(video.width) || isNaN(video.height) || video.width === 0 ||
              video.height === 0) {
            reject(new DOMException(`Bad stream dimensions ` +
                                    `${video.width}x${video.height}`));
          }
          // We know the expected resolution range only in the full screen
          // capture case.
          if (surface == 'monitor') {
            // The chorme display capture stack captures the resolution
            // The chrome display capture stack avoids the odd resolution, so it
            // aligns down the capture resolution when the screen size is odd.
            const expectedWidth = screen.width - (screen.width % 2);
            const expectedHeight = screen.height - (screen.height % 2);
            const kAcceptableDeviation = 2;
            const minW = expectedWidth - kAcceptableDeviation;
            const maxW = expectedWidth + kAcceptableDeviation;
            const minH = expectedHeight - kAcceptableDeviation;
            const maxH = expectedHeight + kAcceptableDeviation;
            if (!(minW <= video.width && video.width <= maxW) ||
              !(minH <= video.height && video.height <= maxH)) {
              reject(new DOMException(`Unexpected capture resolution, got: ` +
                `${video.width}x${video.height}, expected ` +
                  `[${minW}-${maxW}]x[${minH}-${maxH}]`));
            }
          }

          // getDisplayMedia() can produce very large dimensions, reduce for speed.
          const width = Math.max(video.width / 8, 128);
          const height = Math.max(video.height / 8, 128);

          const context = new OffscreenCanvas(width, height).getContext('2d');
          context.drawImage(video, 0, 0, width, height);
          const imageData = context.getImageData(0, 0, width, height);
          if (isBlackFrame(imageData.data, imageData.data.length)) {
            reject(new DOMException('Captured data is considered all black'));
          }

          resolve();
        }
      })
      .catch(reject);
  });
}
</script>
</body>
</html>
