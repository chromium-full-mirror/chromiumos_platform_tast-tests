<!DOCTYPE html>
<html>
  <head lang="en">
    <meta charset=utf-8>
    <title>ClipboardTestPage</title>
    <script>
      async function onCopy(event) {
          const type = getData('format');
          const blob = new Blob([getData('data')], { type });
          const data = [new ClipboardItem({ [type]: blob })];

          await navigator.clipboard.write(data);
      }

      async function onPaste(event) {
          const clipboardContents = await navigator.clipboard.read();
          const mimeType = getData('format');
          for (const item of clipboardContents) {
              const blob = await item.getType(mimeType);
              const result = await blob.text();
              document.getElementById('data').value = result;
          }
      }

      function getData(id) {
          return document.getElementById(id).value;
      }

      window.addEventListener('load', function() {
          document.getElementById('copy_button').addEventListener('click', onCopy);
          document.getElementById('paste_button').addEventListener('click', onPaste);
      });
    </script>
  </head>
  <body>
    <input type="text" id="data" class="data" >
    <input type="text" id="format" class="format" >
    <input type="button" id="copy_button" class="copy" value="Copy" >
    <input type="button" id="paste_button" class="paste" value="Paste" >
  </body>
</html>
