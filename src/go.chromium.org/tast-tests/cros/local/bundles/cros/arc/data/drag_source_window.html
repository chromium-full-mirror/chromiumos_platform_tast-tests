<html>
<head lang="en">
  <meta charset="UTF-8">
  <title>DragDrop Controller</title>
  <style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }
  #drag-start-area {
    width: 100%;
    height: 100%;
    background-color: #ccc;
    text-align: center;
    line-height: 300px;
    font-size: 32px;
  }
  </style>
</head>
<body>
  <script>
    window.addEventListener('load', () => {
        document.querySelector('#drag-start-area').addEventListener(
            'dragstart', (event) => {
                event.dataTransfer.setData('text/plain', 'Data text');
            });
    }, {once: true});
  </script>

  <div id="drag-start-area" draggable="true">Drag start</div>
</body>
</html>
