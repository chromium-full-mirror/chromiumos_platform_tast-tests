<html>
  <title>VcTester</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="camera.png" type="image/png" />
<head>
    <script src="popup.js"></script>
    <style>
       html {
         height: 600px;
         width: 800px;
       }
    </style>
</head>

<body>
    <video id="video_player" controls> </video>
    <button id="startVideoBtn">Start Video</button>
    <button id="stopVideoBtn" disabled>Stop Video</button>
    <br><br>
    <audio id="audio_player" controls> </audio>
    <button id="startAudioBtn">Start Audio</button>
    <button id="stopAudioBtn" disabled>Stop Audio</button>
    <br><br>
    <button id="startScreenSharingBtn">Start Screen Capturing</button>
    <button id="stopScreenSharingBtn" disabled>Stop Screen Capturing</button>

    <div title="HelloAudio">
      <audio src="voice_en_hello.wav" type="audio/wav" controls></audio>
    </div>

</body>

</html>
