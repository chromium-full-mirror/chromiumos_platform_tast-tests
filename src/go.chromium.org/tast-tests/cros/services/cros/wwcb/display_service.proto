syntax = "proto3";

package tast.cros.wwcb;

import "google/protobuf/empty.proto";

option go_package = "go.chromium.org/tast-tests/cros/services/cros/wwcb";


// Chrome allows basic remote operations of Chrome.
service DisplayService {
  // SetMirrorDisplay sets the mirror display settings.
  rpc SetMirrorDisplay (QueryRequest) returns (google.protobuf.Empty){}

  // SetPrimaryDisplay sets the internal or external display as primary mode.
  rpc SetPrimaryDisplay (QueryRequest) returns (google.protobuf.Empty){}

  // SwitchWindowToDisplay finds the window with given title then switch it to the expected display.
  rpc SwitchWindowToDisplay(QueryRequest) returns (google.protobuf.Empty) {}

  // VerifyWindowOnDisplay finds the window with given title then verify it is showing on the expected display or not.
  rpc VerifyWindowOnDisplay(QueryRequest) returns (google.protobuf.Empty) {}

  // VerifyDisplayCount verifies the given  display count to compare with the current numbers of display that system detected.
  rpc VerifyDisplayCount(QueryRequest) returns (google.protobuf.Empty) {}

  // ChangeResolution changes the given display's resolution, respectively low, medium and high resolution.
  rpc ChangeResolution(QueryRequest) returns (google.protobuf.Empty) {}

  // ChangeRelativePosition changes position of external display relative to Chromebook.
  rpc ChangeRelativePosition(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // VerifyAfterLidClose verifies that display resolution is still okay after lid close & windows are all still displayed.
  rpc VerifyAfterLidClose (google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // GetDisplayIDs returns the display ID of all monitor from system information.
  rpc GetDisplayIDs(google.protobuf.Empty) returns (GetDisplayIDsResponse) {}

  // EnsureSetWindowState checks whether the window is in requested window state. If not, make sure to set window state to the requested window state.
  rpc EnsureSetWindowState(QueryRequest) returns (google.protobuf.Empty) {}
}

message QueryRequest{
  int32 display_index = 1;
  int32 display_count = 2;
  bool enable = 3;
  string window_title = 4;
  WindowStateType window_state = 5;
}

message GetDisplayIDsResponse{
	repeated string display_ids = 1;
}
  
enum WindowStateType {
  WINDOW_STATE_NORMAL = 0;
  WINDOW_STATE_MAXIMIZED = 1;
  WINDOW_STATE_MINIMIZED = 2;
  WINDOW_STATE_FULLSCREEN = 3;
}
