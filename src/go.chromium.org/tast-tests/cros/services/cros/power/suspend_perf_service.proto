syntax = "proto3";

package tast.cros.power;

option go_package = "go.chromium.org/tast-tests/cros/services/cros/power";

service SuspendPerfService {
  rpc Suspend(SuspendRequest) returns (SuspendResponse) {}
}

// SuspendRequest is for passing the seconds of suspend duration to Suspend().
message SuspendRequest { int32 seconds = 1; }

// SuspendResponse is for notifying result of Suspend() if it fails to
// execute command or command failure with its output.
// Since Suspend() will disconnect the network, if it works successfully,
// the caller will receive a network error. But if it fails, Suspend() also
// need to notice it failed to suspend.
message SuspendResponse {
  bool failed = 1;
  string output = 2;
}
