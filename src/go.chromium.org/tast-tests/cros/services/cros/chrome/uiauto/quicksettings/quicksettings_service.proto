syntax = "proto3";

package tast.cros.chrome.uiauto.quicksettings;

import "google/protobuf/empty.proto";

option go_package = "go.chromium.org/tast-tests/cros/services/cros/chrome/uiauto/quicksettings";

// QuickSettingsService provides functions for interacting with the Quick
// Settings on ChromeOS devices.
service QuickSettingsService {
  // NavigateToNetworkDetailedView will navigate to the detailed Network view
  // within the Quick Settings. This is safe to call even when the Quick Settings
  // are already open.
  rpc NavigateToNetworkDetailedView(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // NavigateToHotspotDetailedView will navigate to the detailed Hotspot view within the Quick Settings.
  // This is safe to call even when the Quick Settings are already open.
  rpc NavigateToHotspotDetailedView(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // IsHotspotTileShown returns whether the Hotspot feature tile is shown in quick settings.
  rpc IsHotspotTileShown(google.protobuf.Empty) returns (IsHotspotTileShownResponse) {}

  // Hide hides Quick Settings.
  rpc Hide(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // ToggleOption clicks the specified toggle button to enable or disable an option.
  // It does nothing if the state of the toggle button is already as expected.
  rpc ToggleOption(ToggleOptionRequest) returns (google.protobuf.Empty) {}

  // AvailableWifiNetworks looks for all available WiFi networks in the network detailed view,
  // returns a list of SSID of available WiFi networks.
  // This RPC requires the network detailed view to be opened, an error will be returned if
  // the view is not presented.
  rpc AvailableWifiNetworks(google.protobuf.Empty) returns (AvailableWifiNetworksResponse) {}
}

message ToggleOptionRequest {
  enum ToggleButton {
    Wifi = 0;
  }

  ToggleButton toggle_button = 1;

  // This indicates the option to be enabled or disabled.
  bool enabled = 2;
}

message AvailableWifiNetworksResponse {
  repeated string ssids = 1;
}

message IsHotspotTileShownResponse {
  bool is_hotspot_tile_shown = 1;
}