syntax = "proto3";

package tast.cros.dlp;

import "google/protobuf/empty.proto";

option go_package = "go.chromium.org/tast-tests/cros/services/cros/dlp";

message EnrollAndLoginRequest {
  string username = 1;
  string password = 2;
  string dmserver_url = 3;
  string reporting_server_url = 4;
  string enabled_features = 5;
  bool enable_lacros = 6;
}

message ClientIdResponse { string clientId = 1; }

message CreateTempDirResponse { string path = 1; }

message RemoveTempDirRequest { string path = 1; }

enum BrowserType {
  ASH = 0;
  LACROS = 1;
}

// The mode of the applied restriction.
enum Mode {
  BLOCK = 0;
  REPORT = 1;
  WARN_CANCEL = 2;
  WARN_PROCEED = 3;
  ALLOW = 4;
}

message ActionRequest {
  BrowserType browser_type = 1;
  string dataPath = 2;
  Mode mode = 3;
}

message TestCopyFileToDriveRequest { string dataPath = 1; }

// DataLeakPreventionService provides RPC methods to run data leak prevention
// related operations.
service DataLeakPreventionService {
  rpc EnrollAndLogin(EnrollAndLoginRequest) returns (google.protobuf.Empty) {}
  rpc StopChrome(google.protobuf.Empty) returns (google.protobuf.Empty) {}
  rpc ClientID(google.protobuf.Empty) returns (ClientIdResponse) {}
  rpc CreateTempDir(google.protobuf.Empty) returns (CreateTempDirResponse) {}
  rpc RemoveTempDir(RemoveTempDirRequest) returns (google.protobuf.Empty) {}
  rpc ClipboardCopyPaste(ActionRequest) returns (google.protobuf.Empty) {}
  rpc Print(ActionRequest) returns (google.protobuf.Empty) {}
  rpc Screenshot(ActionRequest) returns (google.protobuf.Empty) {}
  rpc Screenshare(ActionRequest) returns (google.protobuf.Empty) {}
  rpc FilesDriveCopyPaste(ActionRequest) returns (google.protobuf.Empty) {}
  rpc TestCopyFileToDrive(TestCopyFileToDriveRequest)
      returns (google.protobuf.Empty) {}
}
