syntax = "proto3";

package tast.cros.firmware;

import "google/protobuf/empty.proto";

option go_package = "go.chromium.org/tast-tests/cros/services/cros/firmware";

// UtilsService provides some basic operations used by firmware tests.
service UtilsService {
  // BlockingSync syncs the root device and internal device.
  rpc BlockingSync(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // FindPhysicalKeyboard finds /dev/input/event* file for physical a keyboard.
  rpc FindPhysicalKeyboard(google.protobuf.Empty) returns (InputDevicePath) {}

  // FindPowerKeyDevice finds /dev/input/event* file for device that reads power
  // key keycodes.
  rpc FindPowerKeyDevice(google.protobuf.Empty) returns (InputDevicePath) {}

  // NewChrome creates a new instance of Chrome
  rpc NewChrome(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // CloseChrome closes an existing instance of Chrome
  rpc CloseChrome(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // ReuseChrome passes an Option to New to make Chrome reuse an exisiting
  // Chrome session.
  rpc ReuseChrome(google.protobuf.Empty) returns (google.protobuf.Empty) {}

  // EvalTabletMode evaluates if DUT is in tablet mode.
  rpc EvalTabletMode(google.protobuf.Empty) returns (EvalTabletModeResponse) {}

  // FindSingleNode finds the specific UI node based on the passed in element.
  rpc FindSingleNode(NodeElement) returns (google.protobuf.Empty) {}

  // GetDetachableBaseValue retrieves the values of relevant detachable-base
  // properties.
  rpc GetDetachableBaseValue(google.protobuf.Empty)
      returns (CrosConfigResponse) {}

  // PerformSpeedometerTest opens a speedometer test website, runs it and
  // returns the result value.
  rpc PerformSpeedometerTest(google.protobuf.Empty)
      returns (SpeedometerResponse) {}

  // CheckCrosConfigProperty checks cros_config and returns the value of a
  // hardware property.
  rpc CheckCrosConfigProperty(CheckCrosConfigRequest)
      returns (CheckCrosConfigResponse) {}

  // FlashUSBDrive flashes the attached USB drive with a ChromeOS test image.
  rpc FlashUSBDrive(FlashUSBDriveRequest) returns (google.protobuf.Empty) {}

  // FirmwareBuildTargets returns the names of the firmware targets from the
  // cros config yaml file.
  rpc FirmwareBuildTargets(FirmwareBuildTargetsRequest)
      returns (FirmwareBuildTargetsResponse) {}

  // ExtractAPFirmwareImage downloads and extracts the AP image from devservers.
  rpc ExtractAPFirmwareImage(ExtractFirmwareImageRequest)
      returns (ExtractFirmwareImageResponse) {}

  // ExtractECFirmwareImage downloads and extracts the EC image from devservers.
  rpc ExtractECFirmwareImage(ExtractFirmwareImageRequest)
      returns (ExtractFirmwareImageResponse) {}
}

// InputDevicePath provides the path to /dev/input/event* for a device.
message InputDevicePath { string path = 1; }

// EvalTabletModeResponse provides the tablet mode enabled status.
message EvalTabletModeResponse { bool tablet_mode_enabled = 1; }

// NodeElement stores the element of UI node.
message NodeElement { string name = 1; }

// CrosConfigResponse provides relevant crosconfig values.
message CrosConfigResponse {
  reserved 1;
  string product_id = 2;
  string vendor_id = 3;
  string usb_path = 4;
  string i2c_path = 5;
}

// SpeedometerResponse provides the result from running a speedometer test.
message SpeedometerResponse { string result = 1; }

// CheckCrosConfigRequest represents a hardware property to be checked.
message CheckCrosConfigRequest {
  string cros_config_path = 1;
  string cros_config_property = 2;
}

// CheckCrosConfigResponse returns the value of a given hardware property.
message CheckCrosConfigResponse { string cros_config_property_value = 1; }

// FlashUSBDriveRequest requests to flash the attached USB drive with the
// ChromeOS image at gsPath using the provided devservers.
message FlashUSBDriveRequest {
  repeated string devserver = 1;
  string gsPath = 2;
}

// FirmwareBuildTargetsRequest is the request to the FirmwareBuildTargets call.
message FirmwareBuildTargetsRequest {}

// FirmwareBuildTargetsResponse is the response from the FirmwareBuildTargets
// call.
message FirmwareBuildTargetsResponse {
  // The name of the coreboot build target. The name to use for image-NAME.bin
  // files and NAME.12345.678.0.tar.bz2 archives.
  string coreboot_name = 1;
  // The name of the EC build target in the firmare-ec-R* branches. The name to
  // use for NAME/ec.bin files and NAME.EC.12345.678.0.tar.bz2 archives.
  string standalone_ec_name = 2;
  // The name of the EC build target in the firmare-BOARD-12345.B (legacy)
  // branches. The name to use for NAME/ec.bin files and
  // NAME.EC.12345.678.0.tar.bz2 archives.
  string legacy_ec_name = 3;
  // The name of the model in chromeos-firmwareupdate's manifest.json file.
  string firmware_manifest_key = 4;
}

// ExtractFirmwareImageRequest is the request to the Extract*FirmwareImage
// calls.
message ExtractFirmwareImageRequest {
  // The list of devservers to try to download from.
  repeated string preferred_devserver = 1;
  // The list of devservers to try to download from if the preferred_devserver
  // list didn't find any.
  repeated string backup_devserver = 2;
  // The location on the DUT to write the file.
  string dest = 3;
  // The gs:// url from which to extract the image.
  string url = 4;
  // The build targets to find in the archive or directory at url.
  FirmwareBuildTargetsResponse build_targets = 5;
  // The board name of the DUT
  string board = 6;
  // The model name of the DUT
  string model = 7;
}

// ExtractFirmwareImageRequest is the response from the Extract*FirmwareImage
// calls.
message ExtractFirmwareImageResponse {}
