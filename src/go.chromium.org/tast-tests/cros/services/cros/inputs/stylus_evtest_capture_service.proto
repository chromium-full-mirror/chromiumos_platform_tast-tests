syntax = "proto3";

package tast.cros.inputs;

import "google/protobuf/empty.proto";

option go_package = "go.chromium.org/tast-tests/cros/services/cros/inputs";

// StylusEvtestCaptureService provides an interface to collect Input from a DUT
// whilst a HMR Job is running.
service StylusEvtestCaptureService {

  rpc StartStylusDataCapture(google.protobuf.Empty)
      returns (StylusEvtestCaptureResponse) {}

  rpc StopStylusDataCapture(google.protobuf.Empty)
      returns (google.protobuf.Empty) {}

  rpc GetScreenSize(google.protobuf.Empty) returns (GetScreenSizeResponse) {}

  rpc CleanUp(google.protobuf.Empty) returns (google.protobuf.Empty) {}
}

message StylusEvtestCaptureResponse {
  string StylusLogPath = 1;
  uint32 WidthResolution = 2;
  uint32 HeightResolution = 3;
}

message GetScreenSizeResponse {
  float Width = 1;
  float Height = 2;
}