syntax = "proto3";

package tast.cros.usb;

import "google/protobuf/empty.proto";

option go_package = "go.chromium.org/tast-tests/cros/services/cros/usb";

// SysfsService provides functionality to check the USB state from a DUT's file system.
service SysfsService {
  rpc GetDevices (google.protobuf.Empty) returns (DeviceMap) {}
}

// Message used to define a USB device.
message Device {
  // Index of the device on its bus.
  uint64 devnum = 1;
  // Device speed in Mbps.
  uint64 speed = 2;
  // Sysfs device removability. Can be fixed, removable or unknown.
  RemovableAttribute removable = 3;
}

// Message used to pass a map of USB devices with the device's properties included.
message DeviceMap {
  map<string, Device> devices = 1;
}

// Enum based on the possible content of the "removable" file for sysfs devices.
enum RemovableAttribute {
  REMOVABLE_ATTRIBUTE_UNKNOWN = 0;
  REMOVABLE_ATTRIBUTE_FIXED = 1;
  REMOVABLE_ATTRIBUTE_REMOVABLE = 2;
}
