syntax = "proto3";

package tast.cros.vm;

import "google/protobuf/empty.proto";

option go_package = "go.chromium.org/tast-tests/cros/services/cros/vm";

// VMService provides RPC methods to be used by VM remote test.
service VMService {
  rpc RunARC (google.protobuf.Empty) returns (google.protobuf.Empty) {}
}
