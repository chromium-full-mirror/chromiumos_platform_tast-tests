<!DOCTYPE html>
	<html lang="en">
	<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mouse Detection</title>
	<style>
		#mouse-coordinates {
			font-size: 24px;
			position: fixed;
			top: 10px;
			left: 10px;
		}
		#click-button {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			padding: 10px 20px;
			font-size: 16px;
			background-color: #007bff;
			color: white;
			border: none;
			cursor: pointer;
		}
	</style>
	</head>
	<body>
	<div id="x">x: </div>
	<button id="click-button">Click</button>

	<script>
		var xElement = document.getElementById('x');
		var clickButton = document.getElementById('click-button');

		function handleMouseMove(event) {
			var mouseX = event.clientX;
			xElement.textContent = "x: " + mouseX;
		}
		function handleClick() {
			xElement.textContent = "x: 0";
		}

		document.addEventListener('mousemove', handleMouseMove);
		clickButton.addEventListener('click', handleClick);
	</script>
	</body>
	</html>
